# 예시 프로필 (가상 인물). 실제 프로필은 cast/<id>.character.yaml 로 저장하며 추적되지 않는다.
# 포맷 정의: references/cast-library-format.md

schema_version: 1

id: dwayne
name: 드웨인
name_en: Dwayne
one_liner: 15년차 시니어 백엔드 개발자, 장애 대응이 몸에 밴 사수
real_person: false
default_role: explainer
alt_roles: [challenger]
status: active

profile:
  age_band: 30대 후반
  occupation: 결제 플랫폼 시니어 백엔드 개발자
  expertise: [분산시스템, 데이터베이스, 장애 대응, 성능 튜닝]
  blind_spots: [프런트엔드 렌더링, 디자인 시스템]
  personality: [침착함, 근거 우선, 잔소리 없는 사수, 은근한 유머]
  background: >
    트래픽 급증으로 결제가 멈춘 새벽을 여러 번 겪었다.
    그래서 "일단 돌아가면 된다"는 말을 가장 경계한다.
    설명할 때 항상 실패 사례부터 꺼낸다.

identity_tokens:
  face: 각진 턱선, 짙은 눈썹, 짧게 정리된 무정형 수염
  hair: 짧은 검은 머리, 옆은 짧게 친 투블럭
  build: 어깨 넓은 180cm 체형, 약간 구부정한 자세
  outfit: 짙은 남색 반팔 셔츠 위 회색 후드집업, 목에 건 사원증
  accessory: 검은 뿔테 안경
  signature_colors: ["#1F2A44", "#C9A227"]
  height_note: 미나보다 머리 하나 큼
  prohibited_drift:
    - 안경 제거 금지
    - 정장 착용 금지
    - 수염 제거 금지

voice:
  speech_level: 존댓말
  tone: 낮고 느린 톤, 단정보다 조건을 먼저 붙임
  catchphrases:
    - "가령 ~ 이라고 해보죠"
    - "이게 언제 깨지냐면요"
    - "정답은 아니고 트레이드오프예요"
  verbal_tics:
    - 설명 전에 "자," 하고 한 박자 쉼
  vocabulary: 정확한 기술 용어를 쓰되 항상 일상 비유를 한 개 붙임
  sentence_length: 보통
  bubble_style: 각진 모서리 말풍선, 남색 테두리
  sample_lines:
    - context: 개념 도입
      line: "가령, 인덱스를 책 뒤 색인이라고 해보죠. 색인이 두꺼워지면요?"
    - context: 오개념 교정
      line: "자, 인덱스를 늘리면 항상 빨라진다는 말은 읽기만 볼 때 맞습니다."
    - context: 한계 명시
      line: "이건 정답이 아니고 트레이드오프예요. 쓰기가 그만큼 느려집니다."
  avoid:
    - 반말
    - 과장된 감탄사
    - 상대를 깎아내리는 농담

teaching:
  speaking_function: 근거와 메커니즘 제시, 한계 명시
  explanation_devices: [실패 사례 먼저, 화이트보드 도식, 일상 비유]
  typical_misconceptions: []

reference_images: []
#  - path: images/dwayne-01.png
#    use: identity
#    note: 정면 얼굴과 안경 형태 고정용

render_notes:
  moderation_risk: low
  known_failures:
    - 사원증 글자가 뭉개짐 -> 텍스트 없는 카드로 지시
  retry_hint: 안경과 후드집업을 프롬프트 앞쪽에 배치하면 안정적

relationships:
  - with: mina
    dynamic: 사수-후배, 미나가 질문하면 드웨인이 반례로 되묻는다

usage:
  good_topics: [데이터베이스, 인프라, 성능, 장애 대응]
  avoid_topics: [UI 디자인, 마케팅]
  appeared_in: []

notes: 페이지당 말풍선 3개 이하일 때 톤이 가장 잘 산다.
